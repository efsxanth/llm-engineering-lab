
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "A LangChain AI agent for analysing synthetic sales data"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.17,<1.0",
]

[tool.setuptools]
py-modules = [
    "data_loader",
    "analytics",
    "agent_tools",
    "sales_agent",
]

[tool.ruff]
target-version = "py312"
line-length = 88
