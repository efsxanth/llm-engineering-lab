
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-feedback-analyser"
version = "0.1.0"
description = "Analyse customer feedback using LangChain and a hosted LLM."
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langchain-groq",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.ruff.lint.isort]
known-first-party = ["customer_feedback_analyser"]

[tool.setuptools.packages.find]
where = ["src"]
